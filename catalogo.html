<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | AJU.GEEK</title>
<link rel="icon" type="image/png" href="imagens/logo.png">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header>

        <div class="logo">
    <img src="imagens/logo.png" alt="AJU.GEEK">
</div>
<button id="menu-mobile">
    <i class="fa-solid fa-bars"></i>
</button>
        <nav>
            <ul>

                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        Início
                    </a>
                </li>

            </ul>
        </nav>

    </header>
<div class="top-banner">
    🚚 Enviamos para todo o Brasil • 💜 Atendimento via WhatsApp • ⭐ Figures colecionáveis
</div>
    <section class="catalogo-page">

        <div class="section-title">
            <h2>Nosso Catálogo</h2>
            <p>Escolha seu próximo colecionável.</p>
        </div>

        <div class="pesquisa-container">

            <input
                type="text"
                id="pesquisa"
                placeholder="🔍 Procurar personagem ou anime..."
            >

        </div>

        <div class="filtros">

            <button class="filtro-btn ativo">
                Todos
            </button>

            <button class="filtro-btn">
                Disponíveis
            </button>

            <button class="filtro-btn">
                Em Breve
            </button>

            <button class="filtro-btn">
                Esgotados
            </button>

        </div>

        <div id="contador-produtos">
            Carregando produtos...
        </div>

        <div id="produtos"></div>

    </section>

    <div id="modal" class="modal">

        <div class="modal-content">

            <span id="fechar-modal">&times;</span>

            <img id="modal-img" src="" alt="">

            <h2 id="modal-nome"></h2>

            <p id="modal-anime"></p>

            <span id="modal-status"></span>

            <a id="modal-whatsapp" target="_blank">
                💬 Tenho Interesse
            </a>

        </div>

    </div>

    <a
        href="https://wa.me/5579996263283"
        target="_blank"
        class="whatsapp-flutuante"
    >
        <i class="fa-brands fa-whatsapp"></i>
    </a>
<footer class="footer-catalogo">

    <img src="imagens/logo.png" alt="AJU.GEEK">

    <p>Figures e Colecionáveis</p>

    <p>© 2026 AJU.GEEK</p>

</footer>
    <script src="catalogo.js"></script>
<script src="app.js"></script>

</body>

</html>
